packages:
  - packages/*
  - apps/*
  # assets/ is reference material only: never a workspace package.

# VitePress (apps/manual) needs esbuild's postinstall to install its binary.
allowBuilds:
  esbuild: true

# Keep the pnpm store inside the repo so installs work in the writable sandbox.
# pnpm-only setting: npm does not understand `store-dir` in .npmrc and warns.
storeDir: .pnpm-store
